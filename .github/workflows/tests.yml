name: Run Tests

on:
  repository_dispatch:
    types: [run-selenium-dev]
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Cambia si usás Java 8 u 11

      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Instalar Chrome y ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          which chromedriver
          chromedriver --version

      - name: Compilar tests
        working-directory: ./testProject
        run: mvn test-compile 

      - name: Listar clases compiladas
        working-directory: ./testProject/target/test-classes
        run: ls -R

      - name: Ejecutar tests con Maven
        working-directory: ./testProject
        run: mvn test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: testProject/target/surefire-reports/