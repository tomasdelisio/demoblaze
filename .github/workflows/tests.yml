name: Run Tests

on:
  repository_dispatch:
    types: [run-selenium-dev]
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Cambiá si usás Java 8 u 11

      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Ejecutar tests con testng.xml
        working-directory: ./testProject
        run: mvn clean test -DsuiteXmlFile=testng.xml
        
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
            name: reporte-pruebas
            path: testProject/test-output/